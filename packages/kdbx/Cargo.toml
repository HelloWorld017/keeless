[package]
name = "keeless_kdbx"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
description = "Platform-independent KeePass database library"
license = "MIT OR MulanPSL-2.0"

[dependencies]
aes = "0.8"
argon2 = "0.5"
base32 = "0.5"
base64 = "0.22"
byteorder = "1"
chacha20 = "0.9"
chrono = "0.4"
ctr = "0.9"
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
log = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
percent-encoding = "2"
quick-xml = "0.37"
regex = "1"
rsa = { version = "0.9", features = ["sha2"] }
salsa20 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
twofish = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }

[dev-dependencies]
hex = "0.4"
keepass = "=0.13.16"
pretty_assertions = "1"
serde_json = "1"
