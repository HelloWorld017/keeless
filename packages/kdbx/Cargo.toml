[package]
name = "keeless_kdbx"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
description = "Platform-independent KeePass database library"
license = "MIT OR MulanPSL-2.0"

[dependencies]
aes = "0.8"
argon2 = "0.5"
base32 = "0.5"
base64 = "0.22"
byteorder = "1"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
chrono = "0.4"
ctr = "0.9"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "pkcs8", "pem"] }
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
hkdf = "0.12"
icu_normalizer = "1.5"
indexmap = "2"
log = "0.4"
minicbor = { version = "=0.25.1", features = ["alloc"] }
nucleo-matcher = "0.3.1"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
percent-encoding = "2"
psl = "2.1"
quick-xml = "0.37"
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1"
rsa = { version = "0.9", features = ["sha2", "pem"] }
salsa20 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
twofish = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keeless_secure_types = { path = "../secure-types", default-features = false, features = ["use_os"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
keeless_secure_types = { path = "../secure-types", default-features = false, features = ["no_os"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "v5", "serde", "js"] }

[dev-dependencies]
hex = "0.4"
keepass = "=0.13.16"
pretty_assertions = "1"
