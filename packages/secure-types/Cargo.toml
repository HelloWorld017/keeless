[package]
name = "keeless_secure_types"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Keeless-vendored secure byte containers"
readme = "README.md"
license = "MIT"

[features]
default = []
no_os = []
use_os = ["dep:libc", "dep:windows-sys"]

[dependencies]
zeroize = "1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
