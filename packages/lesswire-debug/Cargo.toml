[package]
name = "keeless_lesswire_debug"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Diagnostic CLI for the Lesswire protocol"
license = "MIT"

[[bin]]
name = "lesswire-debug"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
keeless_lesswire = { path = "../lesswire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
