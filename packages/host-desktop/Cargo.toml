[package]
name = "keeless_host_desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
description = "Native desktop host for Keeless"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
base64 = "0.22"
directories = "6"
getrandom = "0.2"
hex = "0.4"
keeless_core = { path = "../core" }
keeless_host_desktop_shared = { path = "../host-desktop-shared" }
keeless_lesswire = { path = "../lesswire" }
keeless_sync = { path = "../sync", default-features = false }
napi = { version = "3", features = ["async", "tokio_rt"] }
napi-derive = "3"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
