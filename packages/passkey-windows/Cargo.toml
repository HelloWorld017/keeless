[package]
name = "keeless_passkey_windows"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Windows WebAuthn plugin ceremony primitives for Keeless"

[[bin]]
name = "keeless-passkey-windows"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
keeless_host_desktop_shared = { path = "../host-desktop-shared" }
keeless_passkey_ctap = { path = "../passkey-ctap" }
keeless_schema = { path = "../schema" }
keeless_lesswire = { path = "../lesswire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
