[package]
name = "keeless_core"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Host-independent Keeless backend"
license = "AGPL-3.0"

[dependencies]
keeless_kdbx = { path = "../kdbx" }
keeless_sync = { path = "../sync" }
keeless_schema = { path = "../schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
uuid = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keeless_secure_types = { path = "../secure-types", default-features = false, features = ["use_os"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
keeless_secure_types = { path = "../secure-types", default-features = false, features = ["no_os"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
