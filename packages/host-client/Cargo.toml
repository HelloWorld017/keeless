[package]
name = "keeless_host_client"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local IPC and wire client for reaching the Keeless desktop host"

[dependencies]
directories = "6"
getrandom = { version = "0.2", features = ["std"] }
hex = "0.4"
keeless_lesswire = { path = "../lesswire" }
keeless_schema = { path = "../schema" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "time"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
