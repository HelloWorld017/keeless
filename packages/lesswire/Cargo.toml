[package]
name = "keeless_lesswire"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Authenticated encrypted wire protocol for Keeless"
license = "MIT"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "=2.1.1"
getrandom = "0.2"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = "=1.0.5"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
