[package]
name = "keeless_host_browser"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "IndexedDB-backed browser host for Keeless"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keeless_core = { path = "../core" }
keeless_sync = { path = "../sync" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3"
js-sys = "0.3"
rexie = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Performance", "Window"] }
