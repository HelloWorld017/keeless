[package]
name = "keeless_desktop"
version = "0.0.0"
description = "Desktop shell for keeless"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "keeless_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keeless_desktop_ipc = { path = "../crates/keeless_desktop_ipc" }
keeless_schema = { path = "../../schema" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
