[package]
name = "keeless_daemon"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native Keeless desktop daemon"

[dependencies]
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
keeless_core = { path = "../../../core" }
keeless_desktop_ipc = { path = "../keeless_desktop_ipc" }
keeless_sync = { path = "../../../sync", default-features = false }
rfd = "0.15"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "keeless-daemon"
path = "src/main.rs"
