[package]
name = "keeless_desktop"
version = "0.0.0"
description = "Desktop shell for keeless"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"

[lib]
name = "keeless_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keeless_host_desktop = { path = "../host-desktop" }
keeless_lesswire = { path = "../lesswire" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
