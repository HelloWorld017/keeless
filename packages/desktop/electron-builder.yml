appId: dev.nenw.keeless
productName: keeless
directories:
  output: release
  buildResources: icons
files:
  - dist/**
  - package.json
asarUnpack:
  - assets/*.node
extraResources:
  - from: icons
    to: icons
linux:
  icon: icons/icon.png
  target:
    - AppImage
win:
  icon: icons/icon.ico
  extraResources:
    - from: dist/main/assets/keeless-passkey-windows.exe
      to: bin/keeless-passkey-windows.exe
    - from: dist/main/assets/keeless-passkey-windows.msix
      to: passkey-windows/keeless-passkey-windows.msix
  target:
    - nsis
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
