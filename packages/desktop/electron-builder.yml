appId: dev.nenw.keeless
productName: keeless
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - dist/main/assets/*.node
extraResources:
  - from: src/assets/icons
    to: icons
linux:
  icon: src/assets/icons/icon.png
  extraResources:
    - from: dist/main/assets/keeless-passkey-linux
      to: bin/keeless-passkey-linux
  target:
    - AppImage
win:
  icon: src/assets/icons/icon.ico
  extraResources:
    - from: dist/main/assets/keeless-passkey-windows.exe
      to: bin/keeless-passkey-windows.exe
    - from: dist/main/assets/keeless-passkey-windows.msix
      to: passkey-windows/keeless-passkey-windows.msix
  target:
    - nsis
nsis:
  include: build/windows/installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
