name: Build Linux
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build
        type: string

  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: ./.github/actions/setup-linux
      - run: nix develop -c pnpm --filter @keeless/desktop... run build
      - run: nix develop -c pnpm --filter @keeless/desktop dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            packages/desktop/release/*.deb
            packages/desktop/release/*.pkg.tar.zst
