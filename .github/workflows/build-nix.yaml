name: Build NixOS
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build
        type: string

  workflow_call:
    inputs:
      sha:
        required: true
        type: string

    secrets:
      NIX_CACHE_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: ./.github/actions/setup-linux

      - name: Generate release flake
        run: |
          rev=$(git rev-parse HEAD)
          url="https://github.com/HelloWorld017/keeless/archive/$rev.tar.gz"
          hash=$(nix store prefetch-file --unpack --json "$url" | jq -r .hash)

          mkdir -p flakes/nix
          cp flake.nix flake.lock Cargo.lock package.json flakes/
          cp nix/{package,module}.nix flakes/nix/
          jq -n --arg rev "$rev" --arg hash "$hash" '{rev: $rev, hash: $hash}' > flakes/release.json

      - name: Build
        run: nix build path:./flakes#keeless

      - uses: organization/nix-substitute-release@v1
        with:
          private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
          public-key: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          artifact-name: nix-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: nix-flake
          if-no-files-found: error
          path: flakes/
